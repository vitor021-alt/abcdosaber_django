{% extends "base_template.html" %}

{% block title %}
    <title>AbcDoSaber - Atualizar Título</title>
{% endblock %}

{% block menu %} 
<div class="collapse navbar-collapse justify-content-end" id="mynavbar">
                <div class="navbar-nav">
                    <a href="/" class="nav-link">Início</a>
                    <a href="{% url 'tipodeatividade:cadastro' %}" class="nav-link">Cadastrar</a>
                    <a href="{% url 'tipodeatividade:listar' %}" class="nav-link">Listar</a>
                </div>
            </div>    
{% endblock %}            

{% block titulo_pagina %}
    <h1>Atualizar Tipo de Atividade</h1>
{% endblock %}

{% block corpo %}
<main class="container m-2 w-75 mx-auto">
        <form action="{% url 'tipodeatividade:atualizar' %}" method="POST" name="frmAtualizarTipoAtividade" id="idFrmAtualizarTipoAtividade">
        
        class
            {% csrf_token %}

            <div class="form-group">
                <label for='idCodigo' class="form-label">Código do Tipo de Atividade</label>
                <input class="form-control" type='text' id='idCodigo' name='codigo' value="{{ tipo_atividade.codigo }}" readonly>

            <div class="form-group">
                <label for='idDescricao' class="form-label">Descrição</label>
                <input class="form-control" type='text' id='idDescricao' name='descricao' value="{{ tipo_atividade.descricao }}" placeholder='Informe a descrição' maxlength="70" required>
            </div>

            <div class='form-group text-center'>
                <input type='reset'  value='Limpar' class='btn btn-primary btn-md'>
                <input type='submit' value='Atualizar' class='btn btn-primary btn-md' id="btnAtualizarTipoAtividade">
            </div>
        </form>
    </main>
{% endblock %}
