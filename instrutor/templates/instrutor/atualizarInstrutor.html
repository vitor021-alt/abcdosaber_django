{% extends "base_template.html" %}

{% block title %}
    <title>AbcDoSaber - Atualizar instrutor</title>
{% endblock %}

{% block menu %} 
<div class="collapse navbar-collapse justify-content-end" id="mynavbar">
                <div class="navbar-nav">
                    <a href="/" class="nav-link">Início</a>
                    <a href="{% url 'instrutor:cadastro' %}" class="nav-link">Cadastrar</a>
                    <a href="{% url 'instrutor:listar' %}" class="nav-link">Listar</a>
                </div>
            </div>    
{% endblock %}            

{% block titulo_pagina %}
    <h1>Atualizar Instrutor</h1>
{% endblock %}

{% block corpo %}
<main class="container m-2 w-75 mx-auto">
        <form action="{% url 'instrutor:atualizar' %}" method="POST" name="frmAtualizarInstrutor" id="idFrmAtualizarInstrutor">
              class
            {% csrf_token %}

            <div class="form-group">
                <label for='idCodigo' class="form-label">Código do Instrutor</label>
                <input class="form-control" type='text' id='idCodigo' name='codigo' value="{{ instrutor.codigo }}" readonly>

            <div class="form-group">
                <label for='idDescricao' class="form-label">Descrição</label>
                <input class="form-control" type='text' id='idDescricao' name='descricao' value="{{ instrutor.descricao }}" placeholder='Informe a descrição' maxlength="70" required>
            </div>

            <div class='form-group text-center'>
                <input type='reset'  value='Limpar' class='btn btn-primary btn-md'>
                <input type='submit' value='Atualizar' class='btn btn-primary btn-md' id="btnAtualizarInstrutor">
            </div>
        </form>
    </main>
{% endblock %}
